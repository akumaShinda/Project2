version: '3.8'

services:
  streamfusion:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_LOCAL_URL=http://localhost:3000
      - NEXT_PUBLIC_PUBLIC_URL=http://localhost:3000
      - ADMIN_USERNAME=Akuma
      - ADMIN_PASSWORD=SkylineR30
      - JWT_SECRET=dev_secret_key_123456789
    volumes:
      - ./lib:/app/lib:ro
      - ./app:/app/app:ro
    networks:
      - streamfusion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  streamfusion-network:
    driver: bridge
